name: barometer
on:
  workflow_dispatch:
    inputs:
      mode: { description: "auto（補記到期時段並更新 live）或 live（只更新 live）", default: "auto" }
      force: { description: "強制更新 live.json (true/false)", default: "false" }
  schedule:
    # 備援：週一至五 13:00–21:50 UTC 每 10 分鐘（涵蓋夏令/冬令的美股 09:30–16:30 ET）。
    # GitHub 內建 cron 常延遲且可能跳過；準點請用 cron-job.org 呼叫 workflow_dispatch（見 README）。
    # 腳本以美東時間判斷哪些時段已到期，補記缺漏並避免重複。
    - cron: "*/10 13-21 * * 1-5"
permissions: { contents: write }
concurrency: { group: barometer, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - name: Snapshot / live + commit (自動重試，避免多個執行同時寫入造成衝突)
        env: { MODE: "${{ github.event.inputs.mode || 'auto' }}", FORCE: "${{ github.event.inputs.force }}" }
        run: |
          ARGS="--mode $MODE"; [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          git config user.name "baro-bot"; git config user.email "baro-bot@users.noreply.github.com"
          for i in 1 2 3 4; do
            python scripts/fetch_live.py $ARGS || exit 1
            git add data/
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "data: $(date -u +%FT%TZ)"
            if git push -q; then echo "pushed (try $i)"; exit 0; fi
            echo "push rejected, resync and retry ($i)"
            git fetch -q origin main && git reset -q --hard origin/main
            sleep $((RANDOM % 5 + 2))
          done
          exit 1
